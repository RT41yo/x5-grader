{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Результат проверки</h2>

<div id="resultBlock" class="mb-4">
  <p class="text-muted">Загрузка результата...</p>
</div>

<!-- Чат для уточняющих вопросов -->
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Задать вопрос по оценке</h5>
    <div id="chatBox" class="mb-3" style="max-height: 200px; overflow-y: auto;"></div>
    <div class="input-group">
      <input
        id="chatInput"
        type="text"
        class="form-control"
        placeholder="Например: Почему по критерию ясность у меня 2?"
      />
      <button id="chatSend" class="btn btn-success">Отправить</button>
    </div>
  </div>
</div>

<script>
  const sessionId = "{{ session_id }}";
</script>
{% endblock %}
