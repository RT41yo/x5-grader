{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Сдать решение</h2>

<div class="card">
  <div class="card-body">
    <form id="submitForm" class="row g-3">
      <div class="col-12">
        <label class="form-label">Выберите кейс</label>
        <select id="caseSelect" name="case_id" class="form-select" required></select>
      </div>

      <!-- ОПИСАНИЕ ВЫБРАННОГО КЕЙСА -->
      <div class="col-12 d-none" id="caseDetails">
        <div class="card border-success-subtle">
          <div class="card-body">
            <h5 class="card-title mb-2" id="caseTitle"></h5>
            <p class="card-text mb-0" id="caseDescription" style="white-space: pre-line;"></p>
            <div id="caseSkills" class="mt-3 d-none">
              <strong>Навыки/критерии:</strong>
              <ul class="mb-0" id="caseSkillsList"></ul>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Ваш ответ</label>
        <textarea name="answer_text" class="form-control" rows="6" required
                  placeholder="Опишите ваше решение по кейсу..."></textarea>
      </div>

      <input type="hidden" name="user_id" value="demo_user" />

      <div class="col-12 d-flex align-items-center gap-3">
        <!-- ВАЖНО: type="submit", чтобы сработал submit-обработчик в main.js -->
        <button id="submitBtn" type="submit" class="btn btn-success">Отправить</button>

        <!-- Индикатор статуса -->
        <div id="submitStatus" class="d-none" aria-live="polite">
          <div class="progress" style="width: 260px;">
            <div id="submitProgress"
                 class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                 role="progressbar"
                 aria-valuemin="0" aria-valuemax="100"
                 style="width: 25%;"></div>
          </div>
        </div>
      </div>

      <!-- Текстовый статус (ошибки/успех) -->
      <div class="col-12">
        <small id="submitStatusText" class="text-muted"></small>
      </div>
    </form>
  </div>
</div>
{% endblock %}
