server {
    listen 80;
    server_name _;

    # Общие настройки
    client_max_body_size 4m;

    # Сжатие JSON/текста (упрощает демо)
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # ===== API (Flask) =====
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        # Прокс-заголовки
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SLA-дружественные таймауты
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        send_timeout       5s;
    }

    # ===== Flask pages (SSR шаблоны) =====
    location / {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        send_timeout       10s;
    }

    # ===== Langflow UI + API под префиксом /flow/ =====
    location /flow/ {
        proxy_pass         http://langflow:7860/;  # завершающий / — правильно, чтобы срезать /flow/
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket/SSE
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # Базовые security-заголовки (лайтово, для демо)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
