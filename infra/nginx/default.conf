server {
    listen 80;
    server_name _;

    # API + страницы Flask
    location /api/ {
        proxy_pass         http://api:8000;   # <-- БЕЗ слэша!
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location / {
        proxy_pass         http://api:8000;   # тоже без слэша — путь сохраняется как есть
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Langflow UI + API
    location /flow/ {
        proxy_pass         http://langflow:7860/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
