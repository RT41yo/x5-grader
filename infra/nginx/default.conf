# --- под WebSocket/SSE (нужно для Langflow UI) ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ===== Flask API и веб-страницы =====
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
    }

    # ===== Langflow UI под префиксом /flow =====
    # Сам HTML, роутер SPA и прочее
    location /flow/ {
        proxy_pass         http://langflow:7860/;
        proxy_http_version 1.1;

        # Важно для WS/SSE
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Иногда SPA генерит абсолютные ссылки на /assets — подстрахуемся сабфильтрами
        sub_filter_types   text/html application/javascript text/css;
        sub_filter_once    off;
        sub_filter         'href="/assets/'  'href="/flow/assets/';
        sub_filter         'src="/assets/'   'src="/flow/assets/';
        sub_filter         'fetch("/api/'    'fetch("/flow/api/';
        sub_filter         'axios.get("/api/' 'axios.get("/flow/api/';
    }

    # Явно пробрасываем статику Langflow, которую SPA грузит как /assets/*
    location /assets/ {
        proxy_pass         http://langflow:7860/assets/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Пробрасываем API Langflow, если UI дергает /api/v1/* (иначе уйдёт в Flask)
    location /api/v1/ {
        proxy_pass         http://langflow:7860/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Встречаются и другие пути (на будущее):
    # location /static/ { proxy_pass http://langflow:7860/static/; }
    # location /socket.io/ { ... }  # если будет использоваться socket.io
}
